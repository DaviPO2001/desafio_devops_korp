---
# =========================================================
# 1. MANAGER - K3s Server / Control Plane
# =========================================================

- name: Instalar e configurar K3s Server no manager
  hosts: manager
  become: true

  tasks:

    - name: Instalar dependencias no manager
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
        state: present
        update_cache: true


    # =====================================================
    # CONFIGURACAO K3S / FLANNEL
    # =====================================================

    - name: Criar diretorio de configuracao do K3s
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"


    - name: Configurar interface do Flannel no manager
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: "0644"
        content: |
          flannel-iface: eth1
      register: flannel_config_manager


    # =====================================================
    # INSTALACAO K3S SERVER
    # =====================================================

    - name: Baixar instalador do K3s
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/install-k3s.sh
        mode: "0755"


    - name: Instalar K3s Server
      ansible.builtin.command:
        cmd: /tmp/install-k3s.sh
        creates: /etc/systemd/system/k3s.service
      environment:
        INSTALL_K3S_EXEC: >-
          server
          --disable traefik
          --write-kubeconfig-mode 644
          --node-ip=192.168.56.20
      register: k3s_server_install


    - name: Garantir que K3s Server esteja iniciado
      ansible.builtin.service:
        name: k3s
        state: started
        enabled: true


    - name: Reiniciar K3s Server quando configuracao do Flannel mudar
      ansible.builtin.service:
        name: k3s
        state: restarted
      when:
        - flannel_config_manager.changed
        - not k3s_server_install.changed


    - name: Aguardar API do Kubernetes
      ansible.builtin.wait_for:
        host: 192.168.56.20
        port: 6443
        timeout: 120


    - name: Aguardar token do cluster
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 60


    - name: Ler token do K3s
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: token_k3s


    - name: Salvar token do K3s
      ansible.builtin.set_fact:
        k3s_token: "{{ token_k3s.content | b64decode | trim }}"


    # =====================================================
    # VALIDACAO DO FLANNEL NO MANAGER
    # =====================================================

    - name: Aguardar Flannel utilizar eth1 no manager
      ansible.builtin.command:
        cmd: ip -d link show flannel.1
      register: flannel_manager
      until: >
        'local 192.168.56.20 dev eth1' in flannel_manager.stdout
      retries: 20
      delay: 3
      changed_when: false


    - name: Mostrar configuracao do Flannel no manager
      ansible.builtin.debug:
        var: flannel_manager.stdout_lines


    - name: Verificar node manager
      ansible.builtin.command:
        cmd: kubectl get nodes
      register: resultado_manager
      changed_when: false


    - name: Mostrar manager
      ansible.builtin.debug:
        var: resultado_manager.stdout_lines



# =========================================================
# 2. WORKER - K3s Agent
# =========================================================

- name: Instalar e configurar K3s Agent no worker
  hosts: worker
  become: true

  tasks:

    - name: Instalar dependencias no worker
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
        state: present
        update_cache: true


    # =====================================================
    # CONFIGURACAO K3S / FLANNEL
    # =====================================================

    - name: Criar diretorio de configuracao do K3s no worker
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"


    - name: Configurar interface do Flannel no worker
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: "0644"
        content: |
          flannel-iface: eth1
      register: flannel_config_worker


    # =====================================================
    # INSTALACAO K3S AGENT
    # =====================================================

    - name: Baixar instalador do K3s
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/install-k3s.sh
        mode: "0755"


    - name: Aguardar API do manager
      ansible.builtin.wait_for:
        host: 192.168.56.20
        port: 6443
        timeout: 120


    - name: Instalar K3s Agent
      ansible.builtin.command:
        cmd: /tmp/install-k3s.sh
        creates: /etc/systemd/system/k3s-agent.service
      environment:
        K3S_URL: "https://192.168.56.20:6443"
        K3S_TOKEN: "{{ hostvars['localhost']['k3s_token'] }}"
        INSTALL_K3S_EXEC: "agent --node-ip=192.168.56.21"
      register: k3s_agent_install


    - name: Garantir que K3s Agent esteja iniciado
      ansible.builtin.service:
        name: k3s-agent
        state: started
        enabled: true


    - name: Reiniciar K3s Agent quando configuracao do Flannel mudar
      ansible.builtin.service:
        name: k3s-agent
        state: restarted
      when:
        - flannel_config_worker.changed
        - not k3s_agent_install.changed


    # =====================================================
    # VALIDACAO DO FLANNEL NO WORKER
    # =====================================================

    - name: Aguardar Flannel utilizar eth1 no worker
      ansible.builtin.command:
        cmd: ip -d link show flannel.1
      register: flannel_worker
      until: >
        'local 192.168.56.21 dev eth1' in flannel_worker.stdout
      retries: 20
      delay: 3
      changed_when: false


    - name: Mostrar configuracao do Flannel no worker
      ansible.builtin.debug:
        var: flannel_worker.stdout_lines



# =========================================================
# 3. VALIDACAO + HELM + ARGO CD
# =========================================================

- name: Configurar ferramentas do cluster
  hosts: manager
  become: true

  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  tasks:

    # =====================================================
    # VALIDACAO DO CLUSTER
    # =====================================================

    - name: Aguardar dois nodes ficarem Ready
      ansible.builtin.shell: |
        kubectl get nodes --no-headers | awk '$2 == "Ready" {count++} END {print count}'
      register: nodes_ready
      until: nodes_ready.stdout | int >= 2
      retries: 30
      delay: 5
      changed_when: false


    - name: Exibir nodes do cluster
      ansible.builtin.command:
        cmd: kubectl get nodes -o wide
      register: resultado_cluster
      changed_when: false


    - name: Mostrar cluster
      ansible.builtin.debug:
        var: resultado_cluster.stdout_lines


    # =====================================================
    # TESTE DE DNS DO CLUSTER
    # =====================================================

    - name: Remover pod antigo de teste DNS
      ansible.builtin.command:
        cmd: >-
          kubectl delete pod dns-ansible-test
          -n default
          --ignore-not-found=true
      changed_when: false


    - name: Criar pod temporario para teste de DNS no worker
      ansible.builtin.command:
        cmd: >-
          kubectl run dns-ansible-test
          -n default
          --image=busybox:1.36
          --restart=Never
          --overrides='{"spec":{"nodeSelector":{"kubernetes.io/hostname":"projeto-korp-worker"}}}'
          -- sleep 300


    - name: Aguardar pod de teste DNS ficar Ready
      ansible.builtin.command:
        cmd: >-
          kubectl wait
          --for=condition=Ready
          pod/dns-ansible-test
          -n default
          --timeout=120s
      changed_when: false


    - name: Testar DNS interno do Kubernetes
      ansible.builtin.command:
        cmd: >-
          kubectl exec
          -n default
          dns-ansible-test
          --
          nslookup kubernetes.default.svc.cluster.local
      register: dns_cluster
      retries: 10
      delay: 3
      until: dns_cluster.rc == 0
      changed_when: false


    - name: Mostrar resultado do DNS
      ansible.builtin.debug:
        var: dns_cluster.stdout_lines


    - name: Remover pod temporario de teste DNS
      ansible.builtin.command:
        cmd: >-
          kubectl delete pod dns-ansible-test
          -n default
          --ignore-not-found=true
      changed_when: false


    # =====================================================
    # HELM
    # =====================================================

    - name: Verificar se Helm ja esta instalado
      ansible.builtin.stat:
        path: /usr/local/bin/helm
      register: helm_instalado


    - name: Baixar instalador do Helm
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get_helm.sh
        mode: "0755"
      when: not helm_instalado.stat.exists


    - name: Instalar Helm
      ansible.builtin.command:
        cmd: /tmp/get_helm.sh
      when: not helm_instalado.stat.exists


    - name: Verificar versao do Helm
      ansible.builtin.command:
        cmd: helm version --short
      register: helm_version
      changed_when: false


    - name: Mostrar versao do Helm
      ansible.builtin.debug:
        var: helm_version.stdout


    # =====================================================
    # ARGO CD
    # =====================================================

    - name: Adicionar repositorio Helm do Argo CD
      ansible.builtin.command:
        cmd: helm repo add argo https://argoproj.github.io/argo-helm
      register: argocd_repo
      changed_when: "'has been added' in argocd_repo.stdout"
      failed_when:
        - argocd_repo.rc != 0
        - "'already exists' not in argocd_repo.stderr"


    - name: Atualizar repositorios Helm
      ansible.builtin.command:
        cmd: helm repo update
      changed_when: false


    - name: Instalar ou atualizar Argo CD
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - argocd
          - argo/argo-cd
          - --namespace
          - argocd
          - --create-namespace
          - --set-json
          - 'server.nodeSelector={"kubernetes.io/hostname":"projeto-korp-worker"}'
          - --wait
          - --timeout
          - 10m
      register: argocd_install


    - name: Exibir resultado da instalacao do Argo CD
      ansible.builtin.debug:
        var: argocd_install.stdout_lines


    - name: Verificar pods do Argo CD
      ansible.builtin.command:
        cmd: kubectl get pods -n argocd -o wide
      register: argocd_pods
      changed_when: false


    - name: Mostrar pods do Argo CD
      ansible.builtin.debug:
        var: argocd_pods.stdout_lines


    # =====================================================
    # ACESSO WEB AO ARGO CD
    # =====================================================

    - name: Expor Argo CD como NodePort
      ansible.builtin.command:
        cmd: >-
          kubectl patch service argocd-server
          -n argocd
          -p '{"spec":{"type":"NodePort","ports":[{"name":"https","port":443,"targetPort":8080,"nodePort":30443}]}}'
      register: argocd_nodeport
      changed_when: "'no change' not in argocd_nodeport.stdout"


    - name: Verificar service do Argo CD
      ansible.builtin.command:
        cmd: kubectl get service argocd-server -n argocd
      register: argocd_service
      changed_when: false


    - name: Mostrar service do Argo CD
      ansible.builtin.debug:
        var: argocd_service.stdout_lines


    - name: Aguardar secret inicial do administrador
      ansible.builtin.command:
        cmd: kubectl get secret argocd-initial-admin-secret -n argocd
      register: argocd_secret
      until: argocd_secret.rc == 0
      retries: 20
      delay: 3
      changed_when: false


# =========================================================
# 4. ARGO CD - ROOT APPLICATION / GITOPS
# =========================================================

- name: Registrar Root Application no Argo CD
  hosts: manager
  become: true

  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  vars:
    root_app_file: "/projeto-korp/kubernetes/argocd/root-app.yaml"

  tasks:

    # =====================================================
    # VALIDAR ARQUIVO
    # =====================================================

    - name: Verificar root-app.yaml
      ansible.builtin.stat:
        path: "{{ root_app_file }}"
      register: root_app_manifest


    - name: Validar root-app.yaml
      ansible.builtin.assert:
        that:
          - root_app_manifest.stat.exists
        fail_msg: "Arquivo {{ root_app_file }} nao encontrado."


    # =====================================================
    # REGISTRAR ROOT APP
    # =====================================================

    - name: Aplicar Root Application
      ansible.builtin.command:
        cmd: >-
          kubectl apply
          -f {{ root_app_file }}
      register: root_app_apply
      changed_when: >
        'created' in root_app_apply.stdout or
        'configured' in root_app_apply.stdout


    # =====================================================
    # AGUARDAR APPLICATIONS
    # =====================================================

    - name: Aguardar Root Application aparecer
      ansible.builtin.command:
        cmd: kubectl get application root-app -n argocd
      register: root_app_status
      retries: 40
      delay: 3
      until: root_app_status.rc == 0
      changed_when: false


    - name: Aguardar Application Projeto Korp aparecer
      ansible.builtin.command:
        cmd: kubectl get application projeto-korp -n argocd
      register: projeto_korp_status
      retries: 40
      delay: 3
      until: projeto_korp_status.rc == 0
      changed_when: false


    - name: Aguardar Application Monitoring aparecer
      ansible.builtin.command:
        cmd: kubectl get application monitoring -n argocd
      register: monitoring_application_status
      retries: 40
      delay: 3
      until: monitoring_application_status.rc == 0
      changed_when: false




    # =====================================================
    # AGUARDAR NAMESPACE DA APLICACAO
    # =====================================================

    - name: Aguardar namespace projeto-korp ser criado pelo Argo CD
      ansible.builtin.command:
        cmd: kubectl get namespace projeto-korp
      register: projeto_korp_namespace
      retries: 40
      delay: 3
      until: projeto_korp_namespace.rc == 0
      changed_when: false


    # =====================================================
    # AGUARDAR GITOPS FICAR SAUDAVEL
    # =====================================================

    - name: Aguardar Projeto Korp ficar Synced e Healthy
      ansible.builtin.shell: |
        SYNC=$(kubectl get application projeto-korp -n argocd -o jsonpath='{.status.sync.status}')
        HEALTH=$(kubectl get application projeto-korp -n argocd -o jsonpath='{.status.health.status}')
        echo "${SYNC} ${HEALTH}"
      register: projeto_korp_health
      retries: 120
      delay: 5
      until:
        - "'Synced' in projeto_korp_health.stdout"
        - "'Healthy' in projeto_korp_health.stdout"
      changed_when: false


    - name: Aguardar Monitoring ficar Synced e Healthy
      ansible.builtin.shell: |
        SYNC=$(kubectl get application monitoring -n argocd -o jsonpath='{.status.sync.status}')
        HEALTH=$(kubectl get application monitoring -n argocd -o jsonpath='{.status.health.status}')
        echo "${SYNC} ${HEALTH}"
      register: monitoring_health
      retries: 180
      delay: 5
      until:
        - "'Synced' in monitoring_health.stdout"
        - "'Healthy' in monitoring_health.stdout"
      changed_when: false




    # =====================================================
    # MOSTRAR APPLICATIONS
    # =====================================================

    - name: Listar Applications do Argo CD
      ansible.builtin.command:
        cmd: kubectl get applications -n argocd -o wide
      register: argocd_applications
      changed_when: false


    - name: Mostrar Applications
      ansible.builtin.debug:
        var: argocd_applications.stdout_lines


    - name: Mostrar resultado do GitOps
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "ARGO CD GITOPS CONFIGURADO"
          - ""
          - "Root Application: root-app"
          - "Application: projeto-korp"
          - "Application: monitoring"
          - ""
          - "Argo CD: https://localhost:8443"
          - "=============================================="



# =========================================================
# 5. K6 - TESTE DE CARGA NO MANAGER
# =========================================================

- name: Instalar k6 no manager
  hosts: manager
  become: true

  tasks:

    # =====================================================
    # DEPENDENCIAS
    # =====================================================

    - name: Instalar dependencias do repositorio k6
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - gnupg
        state: present
        update_cache: true


    # =====================================================
    # CHAVE GPG
    # =====================================================

    - name: Adicionar chave GPG do repositorio k6
      ansible.builtin.shell: |
        curl -fsSL https://dl.k6.io/key.gpg |
        gpg --dearmor \
        --yes \
        -o /usr/share/keyrings/k6-archive-keyring.gpg
      args:
        creates: /usr/share/keyrings/k6-archive-keyring.gpg


    # =====================================================
    # REPOSITORIO
    # =====================================================

    - name: Adicionar repositorio do k6
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/k6.list
        mode: "0644"
        content: |
          deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main


    # =====================================================
    # INSTALACAO
    # =====================================================

    - name: Instalar k6
      ansible.builtin.apt:
        name: k6
        state: present
        update_cache: true


    # =====================================================
    # VALIDACAO
    # =====================================================

    - name: Verificar versao do k6
      ansible.builtin.command:
        cmd: k6 version
      register: k6_version
      changed_when: false


    - name: Mostrar versao do k6
      ansible.builtin.debug:
        var: k6_version.stdout


# =========================================================
# 6. RESUMO FINAL - ACESSOS, IPS, PORTAS E CREDENCIAIS
# =========================================================

- name: Mostrar resumo final do ambiente
  hosts: manager
  become: true

  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  vars:
    host_argo_port: "8443"
    host_app_port: "8080"
    host_grafana_port: "3000"
    host_prometheus_port: "9090"

  tasks:

    # =====================================================
    # IPS DOS NODES
    # =====================================================

    - name: Obter IP interno do manager
      ansible.builtin.command:
        cmd: >-
          kubectl get node projeto-korp-manager
          -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}'
      register: manager_ip
      changed_when: false


    - name: Obter IP interno do worker
      ansible.builtin.command:
        cmd: >-
          kubectl get node projeto-korp-worker
          -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}'
      register: worker_ip
      changed_when: false


    # =====================================================
    # NODEPORTS
    # =====================================================

    - name: Obter NodePort do Argo CD
      ansible.builtin.command:
        cmd: >-
          kubectl get service argocd-server
          -n argocd
          -o jsonpath='{.spec.ports[?(@.port==443)].nodePort}'
      register: argocd_nodeport_final
      changed_when: false


    - name: Obter NodePort do NGINX
      ansible.builtin.command:
        cmd: >-
          kubectl get service nginx-projeto-korp
          -n projeto-korp
          -o jsonpath='{.spec.ports[0].nodePort}'
      register: nginx_nodeport
      changed_when: false


    - name: Obter NodePort do Grafana
      ansible.builtin.command:
        cmd: >-
          kubectl get service grafana
          -n monitoring
          -o jsonpath='{.spec.ports[0].nodePort}'
      register: grafana_nodeport
      changed_when: false


    - name: Obter NodePort do Prometheus
      ansible.builtin.command:
        cmd: >-
          kubectl get service prometheus
          -n monitoring
          -o jsonpath='{.spec.ports[0].nodePort}'
      register: prometheus_nodeport
      changed_when: false


    # =====================================================
    # CREDENCIAIS INICIAIS DO ARGO CD
    # =====================================================

    - name: Aguardar secret inicial do Argo CD
      ansible.builtin.command:
        cmd: kubectl get secret argocd-initial-admin-secret -n argocd
      register: argocd_initial_secret
      retries: 30
      delay: 3
      until: argocd_initial_secret.rc == 0
      changed_when: false


    - name: Obter senha inicial do Argo CD
      ansible.builtin.shell: >-
        kubectl get secret argocd-initial-admin-secret
        -n argocd
        -o jsonpath='{.data.password}'
        | base64 -d
      register: argocd_initial_password
      changed_when: false


    # =====================================================
    # CREDENCIAIS INICIAIS DO GRAFANA
    # =====================================================

    - name: Definir credenciais iniciais do Grafana
      ansible.builtin.set_fact:
        grafana_admin_user: "admin"
        grafana_admin_password: "admin"


    # =====================================================
    # STATUS FINAL
    # =====================================================

    - name: Obter status final das Applications
      ansible.builtin.command:
        cmd: kubectl get applications -n argocd
      register: applications_final
      changed_when: false


    - name: Mostrar status final das Applications
      ansible.builtin.debug:
        var: applications_final.stdout_lines


    # =====================================================
    # RESUMO DE ACESSO
    # =====================================================

    - name: Mostrar acessos finais do ambiente
      ansible.builtin.debug:
        msg:
          - "=============================================================="
          - "PROJETO KORP - AMBIENTE CRIADO COM SUCESSO"
          - "=============================================================="
          - ""
          - "NODES KUBERNETES"
          - "Manager: {{ manager_ip.stdout }}"
          - "Worker:  {{ worker_ip.stdout }}"
          - ""
          - "--------------------------------------------------------------"
          - "APLICACAO PROJETO KORP"
          - "Windows/Host: http://localhost:{{ host_app_port }}/projeto-korp"
          - "Health:       http://localhost:{{ host_app_port }}/health"
          - "Metrics:      http://localhost:{{ host_app_port }}/metrics"
          - "Rede privada: http://{{ worker_ip.stdout }}:{{ nginx_nodeport.stdout }}/projeto-korp"
          - "NodePort:     {{ nginx_nodeport.stdout }}"
          - ""
          - "--------------------------------------------------------------"
          - "ARGO CD"
          - "Windows/Host: https://localhost:{{ host_argo_port }}"
          - "Rede privada: https://{{ worker_ip.stdout }}:{{ argocd_nodeport_final.stdout }}"
          - "NodePort:     {{ argocd_nodeport_final.stdout }}"
          - "Usuario inicial: admin"
          - "Senha inicial:   {{ argocd_initial_password.stdout }}"
          - ""
          - "--------------------------------------------------------------"
          - "GRAFANA"
          - "Windows/Host: http://localhost:{{ host_grafana_port }}"
          - "Rede privada: http://{{ worker_ip.stdout }}:{{ grafana_nodeport.stdout }}"
          - "NodePort:     {{ grafana_nodeport.stdout }}"
          - "Usuario inicial: {{ grafana_admin_user }}"
          - "Senha inicial:   {{ grafana_admin_password }}"
          - ""
          - "--------------------------------------------------------------"
          - "PROMETHEUS"
          - "Windows/Host: http://localhost:{{ host_prometheus_port }}"
          - "Rede privada: http://{{ worker_ip.stdout }}:{{ prometheus_nodeport.stdout }}"
          - "NodePort:     {{ prometheus_nodeport.stdout }}"
          - ""
          - "--------------------------------------------------------------"
          - "K6"
          - "Instalado no manager: {{ manager_ip.stdout }}"
          - ""
          - "=============================================================="
