---
# =========================================================
# 1. MANAGER - K3s Server / Control Plane
# =========================================================

- name: Instalar e configurar K3s Server no manager
  hosts: manager
  become: true

  tasks:

    - name: Instalar dependencias no manager
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
        state: present
        update_cache: true


    # =====================================================
    # CONFIGURACAO K3S / FLANNEL
    # =====================================================

    - name: Criar diretorio de configuracao do K3s
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"


    - name: Configurar interface do Flannel no manager
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: "0644"
        content: |
          flannel-iface: eth1
      register: flannel_config_manager


    # =====================================================
    # INSTALACAO K3S SERVER
    # =====================================================

    - name: Baixar instalador do K3s
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/install-k3s.sh
        mode: "0755"


    - name: Instalar K3s Server
      ansible.builtin.command:
        cmd: /tmp/install-k3s.sh
        creates: /etc/systemd/system/k3s.service
      environment:
        INSTALL_K3S_EXEC: >-
          server
          --disable traefik
          --write-kubeconfig-mode 644
          --node-ip=192.168.56.20
      register: k3s_server_install


    - name: Garantir que K3s Server esteja iniciado
      ansible.builtin.service:
        name: k3s
        state: started
        enabled: true


    # Importante para cluster que ja existia.
    # Se config.yaml mudou, reinicia o K3s para o Flannel
    # passar a utilizar eth1.
    - name: Reiniciar K3s Server quando configuracao do Flannel mudar
      ansible.builtin.service:
        name: k3s
        state: restarted
      when:
        - flannel_config_manager.changed
        - not k3s_server_install.changed


    - name: Aguardar API do Kubernetes
      ansible.builtin.wait_for:
        host: 192.168.56.20
        port: 6443
        timeout: 120


    - name: Aguardar token do cluster
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 60


    - name: Ler token do K3s
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: token_k3s


    - name: Salvar token do K3s
      ansible.builtin.set_fact:
        k3s_token: "{{ token_k3s.content | b64decode | trim }}"


    # =====================================================
    # VALIDACAO DO FLANNEL NO MANAGER
    # =====================================================

    - name: Aguardar Flannel utilizar eth1 no manager
      ansible.builtin.command:
        cmd: ip -d link show flannel.1
      register: flannel_manager
      until: >
        'local 192.168.56.20 dev eth1' in flannel_manager.stdout
      retries: 20
      delay: 3
      changed_when: false


    - name: Mostrar configuracao do Flannel no manager
      ansible.builtin.debug:
        var: flannel_manager.stdout_lines


    - name: Verificar node manager
      ansible.builtin.command:
        cmd: kubectl get nodes
      register: resultado_manager
      changed_when: false


    - name: Mostrar manager
      ansible.builtin.debug:
        var: resultado_manager.stdout_lines



# =========================================================
# 2. WORKER - K3s Agent
# =========================================================

- name: Instalar e configurar K3s Agent no worker
  hosts: worker
  become: true

  tasks:

    - name: Instalar dependencias no worker
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
        state: present
        update_cache: true


    # =====================================================
    # CONFIGURACAO K3S / FLANNEL
    # =====================================================

    - name: Criar diretorio de configuracao do K3s no worker
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"


    - name: Configurar interface do Flannel no worker
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: "0644"
        content: |
          flannel-iface: eth1
      register: flannel_config_worker


    # =====================================================
    # INSTALACAO K3S AGENT
    # =====================================================

    - name: Baixar instalador do K3s
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/install-k3s.sh
        mode: "0755"


    - name: Aguardar API do manager
      ansible.builtin.wait_for:
        host: 192.168.56.20
        port: 6443
        timeout: 120


    - name: Instalar K3s Agent
      ansible.builtin.command:
        cmd: /tmp/install-k3s.sh
        creates: /etc/systemd/system/k3s-agent.service
      environment:
        K3S_URL: "https://192.168.56.20:6443"
        K3S_TOKEN: "{{ hostvars['localhost']['k3s_token'] }}"
        INSTALL_K3S_EXEC: "agent --node-ip=192.168.56.21"
      register: k3s_agent_install


    - name: Garantir que K3s Agent esteja iniciado
      ansible.builtin.service:
        name: k3s-agent
        state: started
        enabled: true


    - name: Reiniciar K3s Agent quando configuracao do Flannel mudar
      ansible.builtin.service:
        name: k3s-agent
        state: restarted
      when:
        - flannel_config_worker.changed
        - not k3s_agent_install.changed


    # =====================================================
    # VALIDACAO DO FLANNEL NO WORKER
    # =====================================================

    - name: Aguardar Flannel utilizar eth1 no worker
      ansible.builtin.command:
        cmd: ip -d link show flannel.1
      register: flannel_worker
      until: >
        'local 192.168.56.21 dev eth1' in flannel_worker.stdout
      retries: 20
      delay: 3
      changed_when: false


    - name: Mostrar configuracao do Flannel no worker
      ansible.builtin.debug:
        var: flannel_worker.stdout_lines



# =========================================================
# 3. VALIDACAO + HELM + ARGO CD
# =========================================================

- name: Configurar ferramentas do cluster
  hosts: manager
  become: true

  tasks:

    # =====================================================
    # VALIDACAO DO CLUSTER
    # =====================================================

    - name: Aguardar dois nodes ficarem Ready
      ansible.builtin.shell: |
        kubectl get nodes --no-headers | awk '$2 == "Ready" {count++} END {print count}'
      register: nodes_ready
      until: nodes_ready.stdout | int >= 2
      retries: 30
      delay: 5
      changed_when: false


    - name: Exibir nodes do cluster
      ansible.builtin.command:
        cmd: kubectl get nodes -o wide
      register: resultado_cluster
      changed_when: false


    - name: Mostrar cluster
      ansible.builtin.debug:
        var: resultado_cluster.stdout_lines


    # =====================================================
    # TESTE DE DNS DO CLUSTER
    # =====================================================

    - name: Remover pod antigo de teste DNS
      ansible.builtin.command:
        cmd: >
          kubectl delete pod dns-ansible-test
          -n default
          --ignore-not-found=true
      changed_when: false


    - name: Criar pod temporario para teste de DNS no worker
      ansible.builtin.command:
        cmd: >
          kubectl run dns-ansible-test
          -n default
          --image=busybox:1.36
          --restart=Never
          --overrides='{"spec":{"nodeSelector":{"kubernetes.io/hostname":"projeto-korp-worker"}}}'
          -- sleep 300
      changed_when: true


    - name: Aguardar pod de teste DNS ficar Ready
      ansible.builtin.command:
        cmd: >
          kubectl wait
          --for=condition=Ready
          pod/dns-ansible-test
          -n default
          --timeout=120s
      changed_when: false


    - name: Testar DNS interno do Kubernetes
      ansible.builtin.command:
        cmd: >
          kubectl exec
          -n default
          dns-ansible-test
          --
          nslookup kubernetes.default.svc.cluster.local
      register: dns_cluster
      retries: 10
      delay: 3
      until: dns_cluster.rc == 0
      changed_when: false


    - name: Mostrar resultado do DNS
      ansible.builtin.debug:
        var: dns_cluster.stdout_lines


    - name: Remover pod temporario de teste DNS
      ansible.builtin.command:
        cmd: >
          kubectl delete pod dns-ansible-test
          -n default
          --ignore-not-found=true
      changed_when: false


    # =====================================================
    # HELM
    # =====================================================

    - name: Verificar se Helm ja esta instalado
      ansible.builtin.stat:
        path: /usr/local/bin/helm
      register: helm_instalado


    - name: Baixar instalador do Helm
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get_helm.sh
        mode: "0755"
      when: not helm_instalado.stat.exists


    - name: Instalar Helm
      ansible.builtin.command:
        cmd: /tmp/get_helm.sh
      when: not helm_instalado.stat.exists


    - name: Verificar versao do Helm
      ansible.builtin.command:
        cmd: helm version --short
      register: helm_version
      changed_when: false


    - name: Mostrar versao do Helm
      ansible.builtin.debug:
        var: helm_version.stdout


    # =====================================================
    # ARGO CD
    # =====================================================

    - name: Adicionar repositorio Helm do Argo CD
      ansible.builtin.command:
        cmd: helm repo add argo https://argoproj.github.io/argo-helm
      register: argocd_repo
      changed_when: "'has been added' in argocd_repo.stdout"
      failed_when:
        - argocd_repo.rc != 0
        - "'already exists' not in argocd_repo.stderr"


    - name: Atualizar repositorios Helm
      ansible.builtin.command:
        cmd: helm repo update
      changed_when: false


    - name: Verificar se Argo CD ja esta instalado
      ansible.builtin.command:
        cmd: helm status argocd -n argocd
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: argocd_status
      changed_when: false
      failed_when: false


    - name: Instalar Argo CD
      ansible.builtin.command:
        cmd: >
          helm install argocd argo/argo-cd
          --namespace argocd
          --create-namespace
          --set server.nodeSelector.kubernetes\.io/hostname=projeto-korp-worker
          --wait
          --timeout 5m
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: argocd_install
      when: argocd_status.rc != 0


    - name: Exibir resultado da instalacao do Argo CD
      ansible.builtin.debug:
        var: argocd_install.stdout_lines
      when: argocd_status.rc != 0


    - name: Verificar pods do Argo CD
      ansible.builtin.command:
        cmd: kubectl get pods -n argocd -o wide
      register: argocd_pods
      changed_when: false


    - name: Mostrar pods do Argo CD
      ansible.builtin.debug:
        var: argocd_pods.stdout_lines


    # =====================================================
    # ACESSO WEB AO ARGO CD
    # =====================================================

    - name: Expor Argo CD como NodePort
      ansible.builtin.command:
        cmd: >
          kubectl patch service argocd-server
          -n argocd
          -p '{"spec":{"type":"NodePort","ports":[{"name":"https","port":443,"targetPort":8080,"nodePort":30443}]}}'
      register: argocd_nodeport
      changed_when: "'no change' not in argocd_nodeport.stdout"


    - name: Verificar service do Argo CD
      ansible.builtin.command:
        cmd: kubectl get service argocd-server -n argocd
      register: argocd_service
      changed_when: false


    - name: Mostrar service do Argo CD
      ansible.builtin.debug:
        var: argocd_service.stdout_lines


    - name: Aguardar secret inicial do administrador
      ansible.builtin.command:
        cmd: kubectl get secret argocd-initial-admin-secret -n argocd
      register: argocd_secret
      until: argocd_secret.rc == 0
      retries: 20
      delay: 3
      changed_when: false


    - name: Obter senha inicial do Argo CD
      ansible.builtin.shell: >
        kubectl -n argocd
        get secret argocd-initial-admin-secret
        -o jsonpath='{.data.password}'
        | base64 -d
      register: argocd_admin_password
      changed_when: false


    - name: Mostrar dados de acesso do Argo CD
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "ARGO CD DISPONIVEL"
          - "URL: https://localhost:8443"
          - "Usuario: admin"
          - "Senha: {{ argocd_admin_password.stdout }}"
          - "=============================================="



# =========================================================
# 4. DOCKER - BUILD + TAG + PUSH
# =========================================================

- name: Build e Push da aplicacao para Docker Hub
  hosts: manager
  become: true

  vars:
    dockerhub_usuario: "davipo2001"
    docker_imagem: "desafio_devops_korp"
    docker_tag: "v1"

    projeto_dir: "/projeto-korp"
    env_file: "/vagrant/.env"

  tasks:

    - name: Verificar se arquivo .env existe
      ansible.builtin.stat:
        path: "{{ env_file }}"
      register: arquivo_env


    - name: Validar arquivo .env
      ansible.builtin.assert:
        that:
          - arquivo_env.stat.exists
        fail_msg: "Arquivo .env nao encontrado em {{ env_file }}"


    - name: Ler token do Docker Hub no .env
      ansible.builtin.set_fact:
        dockerhub_token: >-
          {{
            lookup(
              'ansible.builtin.ini',
              'DOCKERHUB_TOKEN type=properties file=' + env_file
            )
          }}
      no_log: true


    - name: Validar token do Docker Hub
      ansible.builtin.assert:
        that:
          - dockerhub_token is defined
          - dockerhub_token | length > 0
        fail_msg: "DOCKERHUB_TOKEN nao foi definido no arquivo .env."
      no_log: true


    - name: Instalar Docker
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true


    - name: Garantir que Docker esteja iniciado
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true


    - name: Verificar Dockerfile
      ansible.builtin.stat:
        path: "{{ projeto_dir }}/Dockerfile"
      register: dockerfile_projeto


    - name: Validar Dockerfile
      ansible.builtin.assert:
        that:
          - dockerfile_projeto.stat.exists
        fail_msg: "Dockerfile nao encontrado em {{ projeto_dir }}/Dockerfile"


    - name: Verificar main.go
      ansible.builtin.stat:
        path: "{{ projeto_dir }}/main.go"
      register: main_go_projeto


    - name: Validar main.go
      ansible.builtin.assert:
        that:
          - main_go_projeto.stat.exists
        fail_msg: "main.go nao encontrado em {{ projeto_dir }}/main.go"


    - name: Login, build e push da imagem
      block:

        - name: Login no Docker Hub
          ansible.builtin.command:
            cmd: >
              docker login
              --username {{ dockerhub_usuario }}
              --password-stdin
            stdin: "{{ dockerhub_token }}"
          no_log: true
          changed_when: false


        - name: Build e tag da imagem
          ansible.builtin.command:
            cmd: >
              docker build
              -t {{ dockerhub_usuario }}/{{ docker_imagem }}:{{ docker_tag }}
              .
          args:
            chdir: "{{ projeto_dir }}"
          register: docker_build


        - name: Push da imagem para Docker Hub
          ansible.builtin.command:
            cmd: >
              docker push
              {{ dockerhub_usuario }}/{{ docker_imagem }}:{{ docker_tag }}
          register: docker_push


      always:

        - name: Logout do Docker Hub
          ansible.builtin.command:
            cmd: docker logout
          changed_when: false
          failed_when: false


    - name: Mostrar imagem publicada
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "IMAGEM PUBLICADA NO DOCKER HUB"
          - "Imagem: {{ dockerhub_usuario }}/{{ docker_imagem }}:{{ docker_tag }}"
          - "=============================================="



# =========================================================
# 5. APLICACAO GO - DEPLOY NO KUBERNETES
# =========================================================

- name: Implantar aplicacao Go no Kubernetes
  hosts: manager
  become: true

  vars:
    manifests_app_dir: "/projeto-korp/kubernetes/manifests/app"
    namespace_app: "projeto-korp"

  tasks:

    - name: Verificar diretorio dos manifests da aplicacao
      ansible.builtin.stat:
        path: "{{ manifests_app_dir }}"
      register: manifests_app


    - name: Validar diretorio dos manifests da aplicacao
      ansible.builtin.assert:
        that:
          - manifests_app.stat.exists
          - manifests_app.stat.isdir
        fail_msg: "Diretorio {{ manifests_app_dir }} nao encontrado."


    - name: Aplicar Namespace
      ansible.builtin.command:
        cmd: >
          kubectl apply
          -f {{ manifests_app_dir }}/namespace.yaml
      register: namespace_apply
      changed_when: >
        'created' in namespace_apply.stdout or
        'configured' in namespace_apply.stdout


    - name: Aplicar Deployment da aplicacao
      ansible.builtin.command:
        cmd: >
          kubectl apply
          -f {{ manifests_app_dir }}/deployment.yaml
      register: app_deployment_apply
      changed_when: >
        'created' in app_deployment_apply.stdout or
        'configured' in app_deployment_apply.stdout


    - name: Aplicar Service da aplicacao
      ansible.builtin.command:
        cmd: >
          kubectl apply
          -f {{ manifests_app_dir }}/service.yaml
      register: app_service_apply
      changed_when: >
        'created' in app_service_apply.stdout or
        'configured' in app_service_apply.stdout


    - name: Aplicar HPA
      ansible.builtin.command:
        cmd: >
          kubectl apply
          -f {{ manifests_app_dir }}/hpa.yaml
      register: app_hpa_apply
      changed_when: >
        'created' in app_hpa_apply.stdout or
        'configured' in app_hpa_apply.stdout


    - name: Aguardar Deployment da aplicacao ficar disponivel
      ansible.builtin.command:
        cmd: >
          kubectl rollout status
          deployment/http-server-projeto-korp
          -n {{ namespace_app }}
          --timeout=180s
      changed_when: false


    - name: Verificar pods da aplicacao
      ansible.builtin.command:
        cmd: kubectl get pods -n {{ namespace_app }} -o wide
      register: app_pods
      changed_when: false


    - name: Mostrar pods da aplicacao
      ansible.builtin.debug:
        var: app_pods.stdout_lines


    - name: Verificar Service da aplicacao
      ansible.builtin.command:
        cmd: >
          kubectl get service
          http-server-projeto-korp
          -n {{ namespace_app }}
      register: app_service
      changed_when: false


    - name: Mostrar Service da aplicacao
      ansible.builtin.debug:
        var: app_service.stdout_lines


    - name: Verificar HPA
      ansible.builtin.command:
        cmd: kubectl get hpa -n {{ namespace_app }}
      register: app_hpa
      changed_when: false


    - name: Mostrar HPA
      ansible.builtin.debug:
        var: app_hpa.stdout_lines



# =========================================================
# 6. NGINX - REVERSE PROXY
# =========================================================

- name: Implantar NGINX no Kubernetes
  hosts: manager
  become: true

  vars:
    manifests_nginx_dir: "/projeto-korp/kubernetes/manifests/nginx"
    namespace_app: "projeto-korp"

  tasks:

    - name: Verificar diretorio dos manifests do NGINX
      ansible.builtin.stat:
        path: "{{ manifests_nginx_dir }}"
      register: nginx_manifests


    - name: Validar diretorio dos manifests do NGINX
      ansible.builtin.assert:
        that:
          - nginx_manifests.stat.exists
          - nginx_manifests.stat.isdir
        fail_msg: "Diretorio {{ manifests_nginx_dir }} nao encontrado."


    - name: Aplicar ConfigMap do NGINX
      ansible.builtin.command:
        cmd: >
          kubectl apply
          -f {{ manifests_nginx_dir }}/configmap.yaml
      register: nginx_configmap_apply
      changed_when: >
        'created' in nginx_configmap_apply.stdout or
        'configured' in nginx_configmap_apply.stdout


    - name: Aplicar Service do NGINX
      ansible.builtin.command:
        cmd: >
          kubectl apply
          -f {{ manifests_nginx_dir }}/service.yaml
      register: nginx_service_apply
      changed_when: >
        'created' in nginx_service_apply.stdout or
        'configured' in nginx_service_apply.stdout


    - name: Aplicar Deployment do NGINX
      ansible.builtin.command:
        cmd: >
          kubectl apply
          -f {{ manifests_nginx_dir }}/deployment.yaml
      register: nginx_deployment_apply
      changed_when: >
        'created' in nginx_deployment_apply.stdout or
        'configured' in nginx_deployment_apply.stdout


    - name: Reiniciar NGINX quando ConfigMap for alterado
      ansible.builtin.command:
        cmd: >
          kubectl rollout restart
          deployment/nginx-projeto-korp
          -n {{ namespace_app }}
      when: nginx_configmap_apply.changed
      changed_when: true


    - name: Aguardar Deployment do NGINX ficar disponivel
      ansible.builtin.command:
        cmd: >
          kubectl rollout status
          deployment/nginx-projeto-korp
          -n {{ namespace_app }}
          --timeout=180s
      changed_when: false


    - name: Verificar pods do NGINX
      ansible.builtin.command:
        cmd: >
          kubectl get pods
          -n {{ namespace_app }}
          -l app=nginx-projeto-korp
          -o wide
      register: nginx_pods
      changed_when: false


    - name: Mostrar pods do NGINX
      ansible.builtin.debug:
        var: nginx_pods.stdout_lines


    - name: Verificar Service do NGINX
      ansible.builtin.command:
        cmd: >
          kubectl get service
          nginx-projeto-korp
          -n {{ namespace_app }}
      register: nginx_service
      changed_when: false


    - name: Mostrar Service do NGINX
      ansible.builtin.debug:
        var: nginx_service.stdout_lines


    - name: Testar aplicacao atraves do NGINX
      ansible.builtin.uri:
        url: http://192.168.56.21:30080/projeto-korp
        method: GET
        status_code: 200
        return_content: true
      register: nginx_test
      retries: 10
      delay: 5
      until: nginx_test.status == 200


    - name: Mostrar resposta da aplicacao
      ansible.builtin.debug:
        var: nginx_test.content


    - name: Mostrar resultado final
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "PROJETO KORP DISPONIVEL"
          - "Aplicacao: http://localhost:8080/projeto-korp"
          - "Health: http://localhost:8080/health"
          - "Metrics: http://localhost:8080/metrics"
          - "Argo CD: https://localhost:8443"
          - "=============================================="
  
# =========================================================
# 7. MONITORAMENTO - KUBE-PROMETHEUS-STACK
# =========================================================

- name: Instalar stack de monitoramento
  hosts: manager
  become: true

  vars:

    monitoring_namespace: "monitoring"

    monitoring_dir: "/projeto-korp/kubernetes/monitoring"

    monitoring_values: "/projeto-korp/kubernetes/monitoring/values.yaml"

    servicemonitor_file: "/projeto-korp/kubernetes/monitoring/servicemonitor.yaml"

    dashboard_file: "/projeto-korp/kubernetes/monitoring/dashboards/projeto-korp.json"

    helm_release: "monitoramento"


  tasks:

    # =====================================================
    # VALIDAR ARQUIVOS
    # =====================================================

    - name: Verificar values.yaml
      ansible.builtin.stat:
        path: "{{ monitoring_values }}"
      register: monitoring_values_file


    - name: Validar values.yaml
      ansible.builtin.assert:
        that:
          - monitoring_values_file.stat.exists
        fail_msg: "Arquivo {{ monitoring_values }} nao encontrado."


    - name: Verificar ServiceMonitor
      ansible.builtin.stat:
        path: "{{ servicemonitor_file }}"
      register: monitoring_servicemonitor_file


    - name: Validar ServiceMonitor
      ansible.builtin.assert:
        that:
          - monitoring_servicemonitor_file.stat.exists
        fail_msg: "Arquivo {{ servicemonitor_file }} nao encontrado."


    - name: Verificar dashboard projeto-korp
      ansible.builtin.stat:
        path: "{{ dashboard_file }}"
      register: projeto_dashboard


    - name: Validar dashboard projeto-korp
      ansible.builtin.assert:
        that:
          - projeto_dashboard.stat.exists
        fail_msg: "Dashboard {{ dashboard_file }} nao encontrada."


    # =====================================================
    # REPOSITORIO HELM
    # =====================================================

    - name: Adicionar repositorio prometheus-community
      ansible.builtin.command:
        cmd: >
          helm repo add
          prometheus-community
          https://prometheus-community.github.io/helm-charts
      register: prometheus_repo
      changed_when: "'has been added' in prometheus_repo.stdout"
      failed_when:
        - prometheus_repo.rc != 0
        - "'already exists' not in prometheus_repo.stderr"


    - name: Atualizar repositorios Helm
      ansible.builtin.command:
        cmd: helm repo update
      changed_when: false


    # =====================================================
    # NAMESPACE
    # =====================================================

    - name: Criar namespace monitoring
      ansible.builtin.command:
        cmd: >
          kubectl create namespace
          {{ monitoring_namespace }}
          --dry-run=client
          -o yaml
      register: monitoring_namespace_yaml
      changed_when: false


    - name: Aplicar namespace monitoring
      ansible.builtin.shell: |
        echo '{{ monitoring_namespace_yaml.stdout }}' | kubectl apply -f -
      register: monitoring_namespace_apply
      changed_when: >
        'created' in monitoring_namespace_apply.stdout or
        'configured' in monitoring_namespace_apply.stdout


    # =====================================================
    # KUBE-PROMETHEUS-STACK
    # =====================================================

    - name: Instalar ou atualizar kube-prometheus-stack
      ansible.builtin.command:
        cmd: >
          helm upgrade --install
          {{ helm_release }}
          prometheus-community/kube-prometheus-stack
          --namespace {{ monitoring_namespace }}
          --create-namespace
          -f {{ monitoring_values }}
          --wait
          --timeout 10m
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: monitoring_install


    # =====================================================
    # SERVICEMONITOR PROJETO KORP
    # =====================================================

    - name: Aplicar ServiceMonitor da aplicacao
      ansible.builtin.command:
        cmd: >
          kubectl apply
          -f {{ servicemonitor_file }}
      register: servicemonitor_apply
      changed_when: >
        'created' in servicemonitor_apply.stdout or
        'configured' in servicemonitor_apply.stdout


    # =====================================================
    # DASHBOARD PROJETO KORP
    # =====================================================

    - name: Criar ConfigMap da dashboard Projeto Korp
      ansible.builtin.shell: >
        kubectl create configmap projeto-korp-dashboard
        -n {{ monitoring_namespace }}
        --from-file=projeto-korp.json={{ dashboard_file }}
        --dry-run=client
        -o yaml
        |
        kubectl apply -f -
      register: dashboard_configmap
      changed_when: >
        'created' in dashboard_configmap.stdout or
        'configured' in dashboard_configmap.stdout


    - name: Adicionar label para Grafana detectar dashboard
      ansible.builtin.command:
        cmd: >
          kubectl label configmap
          projeto-korp-dashboard
          -n {{ monitoring_namespace }}
          grafana_dashboard=1
          --overwrite
      changed_when: false


    # =====================================================
    # VALIDACAO DOS PODS
    # =====================================================

    - name: Aguardar pods do monitoramento
      ansible.builtin.command:
        cmd: >
          kubectl wait
          --for=condition=Ready
          pod
          --all
          -n {{ monitoring_namespace }}
          --timeout=300s
      changed_when: false


    - name: Verificar pods do monitoramento
      ansible.builtin.command:
        cmd: >
          kubectl get pods
          -n {{ monitoring_namespace }}
          -o wide
      register: monitoring_pods
      changed_when: false


    - name: Mostrar pods do monitoramento
      ansible.builtin.debug:
        var: monitoring_pods.stdout_lines


    # =====================================================
    # SERVICES
    # =====================================================

    - name: Verificar Services do monitoramento
      ansible.builtin.command:
        cmd: >
          kubectl get svc
          -n {{ monitoring_namespace }}
      register: monitoring_services
      changed_when: false


    - name: Mostrar Services do monitoramento
      ansible.builtin.debug:
        var: monitoring_services.stdout_lines


    # =====================================================
    # SERVICEMONITOR
    # =====================================================

    - name: Verificar ServiceMonitor Projeto Korp
      ansible.builtin.command:
        cmd: >
          kubectl get servicemonitor
          -n projeto-korp
      register: servicemonitor_result
      changed_when: false


    - name: Mostrar ServiceMonitor
      ansible.builtin.debug:
        var: servicemonitor_result.stdout_lines


    # =====================================================
    # SENHA DO GRAFANA
    # =====================================================

    - name: Obter senha inicial do Grafana
      ansible.builtin.shell: >
        kubectl get secret
        {{ helm_release }}-grafana
        -n {{ monitoring_namespace }}
        -o jsonpath='{.data.admin-password}'
        |
        base64 -d
      register: grafana_password
      changed_when: false


    # =====================================================
    # RESULTADO
    # =====================================================

    - name: Mostrar dados do monitoramento
      ansible.builtin.debug:

        msg:

          - "=============================================="

          - "MONITORAMENTO DISPONIVEL"

          - ""

          - "Grafana:"
          - "URL: http://localhost:3000"
          - "Usuario: admin"
          - "Senha: {{ grafana_password.stdout }}"

          - ""

          - "Prometheus:"
          - "URL: http://localhost:9090"

          - ""

          - "Dashboard customizada:"
          - "projeto-korp"

          - ""

          - "ServiceMonitor:"
          - "http-server-projeto-korp"

          - "=============================================="

# =========================================================
# 7. K6 - TESTE DE CARGA NO MANAGER
# =========================================================

- name: Instalar k6 no manager
  hosts: manager
  become: true

  tasks:

    # =====================================================
    # DEPENDENCIAS
    # =====================================================

    - name: Instalar dependencias do repositorio k6
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - gnupg
        state: present
        update_cache: true


    # =====================================================
    # CHAVE GPG
    # =====================================================

    - name: Adicionar chave GPG do repositorio k6
      ansible.builtin.shell: |
        curl -fsSL https://dl.k6.io/key.gpg |
        gpg --dearmor \
        --yes \
        -o /usr/share/keyrings/k6-archive-keyring.gpg
      args:
        creates: /usr/share/keyrings/k6-archive-keyring.gpg


    # =====================================================
    # REPOSITORIO
    # =====================================================

    - name: Adicionar repositorio do k6
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/k6.list
        mode: "0644"
        content: |
          deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main


    # =====================================================
    # INSTALACAO
    # =====================================================

    - name: Instalar k6
      ansible.builtin.apt:
        name: k6
        state: present
        update_cache: true


    # =====================================================
    # VALIDACAO
    # =====================================================

    - name: Verificar versao do k6
      ansible.builtin.command:
        cmd: k6 version
      register: k6_version
      changed_when: false


    - name: Mostrar versao do k6
      ansible.builtin.debug:
        var: k6_version.stdout

# =========================================================
# 8. ARGO CD - REGISTRAR ROOT APPLICATION
# =========================================================

- name: Registrar Root Application no Argo CD
  hosts: manager
  become: true

  vars:

    root_app_file: "/projeto-korp/kubernetes/argocd/root-app.yaml"


  tasks:

    # =====================================================
    # VALIDAR ARQUIVO
    # =====================================================

    - name: Verificar root-app.yaml
      ansible.builtin.stat:
        path: "{{ root_app_file }}"
      register: root_app_manifest


    - name: Validar root-app.yaml
      ansible.builtin.assert:
        that:
          - root_app_manifest.stat.exists
        fail_msg: "Arquivo {{ root_app_file }} nao encontrado."


    # =====================================================
    # REGISTRAR ROOT APP
    # =====================================================

    - name: Aplicar Root Application
      ansible.builtin.command:
        cmd: >
          kubectl apply
          -f {{ root_app_file }}
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: root_app_apply

      changed_when: >
        'created' in root_app_apply.stdout or
        'configured' in root_app_apply.stdout


    # =====================================================
    # AGUARDAR ROOT APP
    # =====================================================

    - name: Aguardar Root Application aparecer
      ansible.builtin.command:
        cmd: >
          kubectl get application
          root-app
          -n argocd
      register: root_app_status
      retries: 20
      delay: 3
      until: root_app_status.rc == 0
      changed_when: false


    # =====================================================
    # AGUARDAR PROJETO KORP
    # =====================================================

    - name: Aguardar Application Projeto Korp aparecer
      ansible.builtin.command:
        cmd: >
          kubectl get application
          projeto-korp
          -n argocd
      register: projeto_korp_status
      retries: 20
      delay: 3
      until: projeto_korp_status.rc == 0
      changed_when: false


    # =====================================================
    # MOSTRAR APPLICATIONS
    # =====================================================

    - name: Listar Applications do Argo CD
      ansible.builtin.command:
        cmd: >
          kubectl get applications
          -n argocd
          -o wide
      register: argocd_applications
      changed_when: false


    - name: Mostrar Applications
      ansible.builtin.debug:
        var: argocd_applications.stdout_lines


    # =====================================================
    # RESULTADO
    # =====================================================

    - name: Mostrar resultado do GitOps
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "ARGO CD GITOPS CONFIGURADO"
          - ""
          - "Root Application:"
          - "root-app"
          - ""
          - "Application:"
          - "projeto-korp"
          - ""
          - "Argo CD:"
          - "https://localhost:8443"
          - "=============================================="