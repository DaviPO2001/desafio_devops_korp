apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: nginx-projeto-korp
  namespace: projeto-korp

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-projeto-korp

  minReplicas: 1
  maxReplicas: 2

  metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: nginx

        target:
          type: Utilization
          averageUtilization: 30

  behavior:

    scaleUp:
      stabilizationWindowSeconds: 0

      policies:
        - type: Percent
          value: 100
          periodSeconds: 30

        - type: Pods
          value: 1
          periodSeconds: 30

      selectPolicy: Max

    scaleDown:
      stabilizationWindowSeconds: 180

      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

      selectPolicy: Max
