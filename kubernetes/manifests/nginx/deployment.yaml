apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-projeto-korp
  namespace: projeto-korp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx-projeto-korp

  template:
    metadata:
      labels:
        app: nginx-projeto-korp

    spec:

      nodeSelector:
        kubernetes.io/hostname: projeto-korp-worker

      containers:

        - name: nginx

          image: nginx:1.30.4-alpine
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80

          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"

            limits:
              cpu: "200m"
              memory: "128Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

            - name: nginx-logs
              mountPath: /var/log/nginx

        - name: nginxlog-exporter

          image: quay.io/martinhelmich/prometheus-nginxlog-exporter:v1.11.0
          imagePullPolicy: IfNotPresent

          args:
            - -config-file
            - /etc/nginxlog-exporter/config.yaml

          ports:
            - name: metrics
              containerPort: 4040

          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"

            limits:
              cpu: "100m"
              memory: "64Mi"

          volumeMounts:
            - name: nginx-logs
              mountPath: /var/log/nginx
              readOnly: true

            - name: nginxlog-exporter-config
              mountPath: /etc/nginxlog-exporter/config.yaml
              subPath: config.yaml

      volumes:

        - name: nginx-config
          configMap:
            name: nginx-config

        - name: nginxlog-exporter-config
          configMap:
            name: nginxlog-exporter-config

        - name: nginx-logs
          emptyDir: {}
