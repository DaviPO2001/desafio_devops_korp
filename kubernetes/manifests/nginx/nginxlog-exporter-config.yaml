apiVersion: v1
kind: ConfigMap

metadata:
  name: nginxlog-exporter-config
  namespace: projeto-korp

data:
  config.yaml: |
    listen:
      port: 4040
      address: "0.0.0.0"
      metrics_endpoint: "/metrics"

    namespaces:
      - name: nginx
        format: '$remote_addr "$request" $status $body_bytes_sent $request_time $upstream_response_time'

        source:
          files:
            - /var/log/nginx/access.log

        histogram_buckets:
          - 0.001
          - 0.0025
          - 0.005
          - 0.01
          - 0.025
          - 0.05
          - 0.1
          - 0.25
          - 0.5
          - 1
          - 2.5
          - 5
          - 10
