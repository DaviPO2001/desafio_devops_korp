apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: monitoring
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:
  project: default

  sources:

    - repoURL: https://prometheus-community.github.io/helm-charts

      chart: kube-prometheus-stack

      targetRevision: 88.6.3

      helm:
        releaseName: monitoramento

        valueFiles:
          - $values/kubernetes/monitoring/values.yaml


    - repoURL: https://github.com/DaviPO2001/desafio_devops_korp.git

      targetRevision: main

      ref: values


  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring


  syncPolicy:

    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true

    retry:
      limit: 10

      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m