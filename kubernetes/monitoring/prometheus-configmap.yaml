apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:

      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: http-server-projeto-korp

        metrics_path: /metrics

        kubernetes_sd_configs:
          - role: endpoints

        relabel_configs:

          - source_labels:
              - __meta_kubernetes_namespace
            action: keep
            regex: projeto-korp

          - source_labels:
              - __meta_kubernetes_service_name
            action: keep
            regex: http-server-projeto-korp

          - source_labels:
              - __meta_kubernetes_endpoint_port_name
            action: keep
            regex: http

          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod

          - source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace

      - job_name: nginx-log-exporter

        metrics_path: /metrics

        kubernetes_sd_configs:
          - role: endpoints

        relabel_configs:

          - source_labels:
              - __meta_kubernetes_namespace
            action: keep
            regex: projeto-korp

          - source_labels:
              - __meta_kubernetes_service_name
            action: keep
            regex: nginx-metrics

          - source_labels:
              - __meta_kubernetes_endpoint_port_name
            action: keep
            regex: metrics

          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod

          - source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace

      - job_name: node-exporter

        kubernetes_sd_configs:
          - role: endpoints

        relabel_configs:

          - source_labels:
              - __meta_kubernetes_namespace
            action: keep
            regex: monitoring

          - source_labels:
              - __meta_kubernetes_service_name
            action: keep
            regex: node-exporter

          - source_labels:
              - __meta_kubernetes_endpoint_port_name
            action: keep
            regex: metrics

          - source_labels:
              - __meta_kubernetes_pod_node_name
            target_label: node

      - job_name: kube-state-metrics

        kubernetes_sd_configs:
          - role: endpoints

        relabel_configs:

          - source_labels:
              - __meta_kubernetes_namespace
            action: keep
            regex: monitoring

          - source_labels:
              - __meta_kubernetes_service_name
            action: keep
            regex: kube-state-metrics

          - source_labels:
              - __meta_kubernetes_endpoint_port_name
            action: keep
            regex: http

      # Coleta métricas de uso real dos containers pelo cAdvisor
      # através do proxy da API do Kubernetes.
      - job_name: kubernetes-cadvisor

        scheme: https

        kubernetes_sd_configs:
          - role: node

        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

        relabel_configs:

          - target_label: __address__
            replacement: kubernetes.default.svc:443

          - source_labels:
              - __meta_kubernetes_node_name
            target_label: __metrics_path__
            regex: (.+)
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

          - source_labels:
              - __meta_kubernetes_node_name
            target_label: node
