apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: node-exporter

spec:

  selector:
    matchLabels:
      app: node-exporter

  template:
    metadata:
      labels:
        app: node-exporter

    spec:

      hostNetwork: true
      hostPID: true

      containers:

        - name: node-exporter

          image: quay.io/prometheus/node-exporter:v1.12.1-distroless
          imagePullPolicy: IfNotPresent

          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --web.listen-address=:9100

          ports:
            - name: metrics
              containerPort: 9100

          resources:
            requests:
              cpu: "30m"
              memory: "32Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"

          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true

            - name: sys
              mountPath: /host/sys
              readOnly: true

            - name: root
              mountPath: /host/root
              readOnly: true
              mountPropagation: HostToContainer

      volumes:

        - name: proc
          hostPath:
            path: /proc

        - name: sys
          hostPath:
            path: /sys

        - name: root
          hostPath:
            path: /

---
apiVersion: v1
kind: Service

metadata:
  name: node-exporter

spec:

  selector:
    app: node-exporter

  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
