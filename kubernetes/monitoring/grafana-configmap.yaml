apiVersion: v1
kind: ConfigMap

metadata:
  name: grafana-provisioning

data:

  datasource.yaml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true

  dashboard-provider.yaml: |
    apiVersion: 1

    providers:
      - name: Projeto Korp
        orgId: 1
        folder: Projeto Korp
        type: file
        disableDeletion: false
        editable: true

        options:
          path: /var/lib/grafana/dashboards
