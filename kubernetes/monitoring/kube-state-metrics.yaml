apiVersion: v1
kind: ServiceAccount

metadata:
  name: kube-state-metrics

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: kube-state-metrics-projeto-korp

rules:

  - apiGroups:
      - ""
    resources:
      - namespaces
      - nodes
      - pods
      - services
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: kube-state-metrics-projeto-korp

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics-projeto-korp

subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: monitoring

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: kube-state-metrics

spec:
  replicas: 1

  selector:
    matchLabels:
      app: kube-state-metrics

  template:
    metadata:
      labels:
        app: kube-state-metrics

    spec:

      serviceAccountName: kube-state-metrics

      nodeSelector:
        kubernetes.io/hostname: projeto-korp-manager

      containers:

        - name: kube-state-metrics

          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
          imagePullPolicy: IfNotPresent

          args:
            - --resources=pods,nodes,namespaces,deployments,replicasets,statefulsets,daemonsets,services,persistentvolumeclaims

          ports:
            - name: http
              containerPort: 8080

            - name: telemetry
              containerPort: 8081

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service

metadata:
  name: kube-state-metrics

spec:

  selector:
    app: kube-state-metrics

  ports:
    - name: http
      port: 8080
      targetPort: http

    - name: telemetry
      port: 8081
      targetPort: telemetry
