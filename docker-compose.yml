services:
  http-server-projeto-korp:
    image: projeto-korp-imagem:latest
    container_name: http-server-projeto-korp
    networks:
      - projeto-korp-network

  nginx:
    image: nginx:latest
    container_name: nginx-projeto-korp
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d
    networks:
      - projeto-korp-network
    depends_on:
      - http-server-projeto-korp

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-projeto-korp
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - projeto-korp-network
    depends_on:
      - http-server-projeto-korp

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-projeto-korp
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - projeto-korp-network
    depends_on:
      - prometheus

networks:
  projeto-korp-network:
    external: true

volumes:
  grafana-data:
