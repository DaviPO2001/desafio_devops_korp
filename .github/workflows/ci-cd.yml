name: CI/CD Projeto Korp

on:
  push:
    branches:
      - main

    paths:
      - "main.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: projeto-korp-cicd
  cancel-in-progress: false

env:
  IMAGE_NAME: davipo2001/desafio_devops_korp
  DEPLOYMENT_FILE: kubernetes/manifests/app/deployment.yaml

jobs:

  # =======================================================
  # CI - TESTES
  # =======================================================

  test:
    name: Testar aplicação
    runs-on: ubuntu-latest

    steps:

      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Baixar dependências
        run: go mod download

      - name: Executar testes
        run: go test ./...

      - name: Executar go vet
        run: go vet ./...


  # =======================================================
  # CI - BUILD E PUSH DA IMAGEM
  # =======================================================

  build:
    name: Build e Push Docker
    runs-on: ubuntu-latest

    needs:
      - test

    outputs:
      image_tag: ${{ steps.image_tag.outputs.tag }}

    steps:

      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Gerar tag da imagem
        id: image_tag
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Imagem: ${IMAGE_NAME}:${SHORT_SHA}"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.image_tag.outputs.tag }}


  # =======================================================
  # CD - ATUALIZAR MANIFEST
  # =======================================================

  update-manifest:
    name: Atualizar manifest Kubernetes
    runs-on: ubuntu-latest

    needs:
      - build

    steps:

      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar imagem no Deployment
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          sed -i \
            "s|image: ${IMAGE_NAME}:.*|image: ${IMAGE_NAME}:${IMAGE_TAG}|" \
            "${DEPLOYMENT_FILE}"

          echo "Nova imagem:"
          grep "image:" "${DEPLOYMENT_FILE}"

      - name: Configurar usuário Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit da nova versão
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          git add "${DEPLOYMENT_FILE}"

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commit."
            exit 0
          fi

          git commit -m "chore: deploy imagem ${IMAGE_TAG}"

      - name: Push da alteração
        run: git push origin main